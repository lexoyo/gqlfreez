{% set countries = get_section(path="countries/_index.md") %}
<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Countries</title></head>
  <body>
    <h1>{{ countries.pages | length }} countries</h1>
    <ul>
      {% for page in countries.pages %}
        <li><a href="{{ page.permalink }}">{{ page.title }}</a></li>
      {% endfor %}
    </ul>
  </body>
</html>
