{% set data = load_data(path="data/countries.json") %}
<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Countries</title></head>
  <body>
    <h1>{{ data.countries | length }} countries</h1>
    <ul>
      {% for country in data.countries[:20] %}
        <li><a href="{{ get_url(path="@/countries/" ~ country.code ~ ".md") }}">{{ country.emoji }} {{ country.name }}</a> — {{ country.continent.name }}</li>
      {% endfor %}
    </ul>
  </body>
</html>
