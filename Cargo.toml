[package]
name = "gqlfreez"
version = "0.1.0"
edition = "2021"
description = "Freeze GraphQL query results into JSON files, next to the queries."
homepage = "https://github.com/lexoyo/gqlfreez"
repository = "https://github.com/lexoyo/gqlfreez"
license = "GPL-3.0"
keywords = ["graphql", "static-site", "jamstack", "build", "cli"]
categories = ["command-line-utilities", "web-programming"]

[profile.release]
opt-level = "s"
lto = true
strip = true

[dependencies]
anyhow = "1.0.104"
apollo-parser = "0.8.6"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
ignore = "0.4.33"
path-slash = "0.2.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "system-proxy", "json", "gzip", "http2", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
toml = "1.1.4"
